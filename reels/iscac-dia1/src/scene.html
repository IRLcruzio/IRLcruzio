<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ISCAC · "Aquário" à noite · DIA 1 — reel de 30 s (1080x1920)
const W=1080,H=1920,DURATION=45;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
const grains=[];for(let g=0;g<5;g++){const c=document.createElement('canvas');c.width=270;c.height=480;const x=c.getContext('2d');const id=x.createImageData(270,480);for(let i=0;i<id.data.length;i+=4){const v=hash(i*.37+g*13.1)*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}x.putImageData(id,0,0);grains.push(c);}
const INK='#141218', SKIN='#f6f1e7';

// ================= ROOM (world coords, wide shot = identity) =================
function drawRoom(t){
  // ceiling
  ctx.fillStyle='#120f0e'; ctx.fillRect(-600,-600,W+1200,800);
  // clerestory windows — night sky
  const sg=ctx.createLinearGradient(0,200,0,640); sg.addColorStop(0,'#06070f'); sg.addColorStop(1,'#16112a'); ctx.fillStyle=sg; ctx.fillRect(-600,200,W+1200,440);
  for(let i=0;i<26;i++){ ctx.fillStyle=`rgba(255,${190+hash(i)*50|0},120,${.25+.4*hash(i+3)})`; ctx.fillRect(-300+hash(i+7)*1700,420+hash(i+9)*190,4,4); }
  ctx.fillStyle='#0b0a0c'; for(let i=0;i<12;i++){ const x=-300+i*150; ctx.beginPath(); ctx.ellipse(x,640,90+hash(i)*60,60+hash(i+1)*70,0,Math.PI,0); ctx.fill(); }
  ctx.strokeStyle='#2a2522'; ctx.lineWidth=14; for(let x=-540;x<W+600;x+=270){ ctx.beginPath(); ctx.moveTo(x,200); ctx.lineTo(x,640); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-600,206); ctx.lineTo(W+600,206); ctx.stroke();
  // interior concrete wall
  const wg=ctx.createLinearGradient(0,640,0,1190); wg.addColorStop(0,'#3d342d'); wg.addColorStop(1,'#6a5a4b'); ctx.fillStyle=wg; ctx.fillRect(-600,640,W+1200,560);
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=3; for(let x=-450;x<W+600;x+=360){ ctx.beginPath(); ctx.moveTo(x,640); ctx.lineTo(x,1190); ctx.stroke(); }
  for(let i=0;i<40;i++){ ctx.fillStyle=`rgba(0,0,0,${.05+hash(i)*.06})`; ctx.beginPath(); ctx.arc(-300+hash(i+2)*1700,660+hash(i+4)*500,3+hash(i+5)*6,0,7); ctx.fill(); }
  // pendant bell lamps (from photos)
  for(const x of [170,540,910]){ ctx.strokeStyle='#0c0b0b'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,200); ctx.lineTo(x,470); ctx.stroke();
    ctx.fillStyle='#d9d2c4'; ctx.beginPath(); ctx.moveTo(x-22,470); ctx.lineTo(x+22,470); ctx.lineTo(x+62,540); ctx.lineTo(x-62,540); ctx.closePath(); ctx.fill();
    glow(x,560,260,'rgba(255,214,150,A)',.35); ctx.fillStyle='#fff4d8'; ctx.beginPath(); ctx.ellipse(x,540,58,9,0,0,7); ctx.fill(); }
  // ISCAC red neon (stylised arch + name)
  const fl=hash(Math.floor(t*10))>.06?1:.35;
  ctx.save(); ctx.translate(205,820); glow(0,0,260,'rgba(255,30,40,A)',.28*fl);
  ctx.strokeStyle=`rgba(255,40,50,${fl})`; ctx.shadowColor='rgba(255,30,40,.95)'; ctx.shadowBlur=26; ctx.lineCap='round';
  for(const r of [62,44,26]){ ctx.lineWidth=11; ctx.beginPath(); ctx.arc(0,-10,r,Math.PI,0); ctx.stroke(); }
  ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(-62,-10); ctx.lineTo(-62,22); ctx.moveTo(62,-10); ctx.lineTo(62,22); ctx.stroke();
  ctx.font='700 46px "DejaVu Serif"'; ctx.textAlign='center'; ctx.fillStyle=`rgba(255,50,60,${fl})`; ctx.letterSpacing='10px'; ctx.fillText('ISCAC',6,86); ctx.restore();
  // digital clock: 02:47
  ctx.fillStyle='#0d0b0b'; rrect(375,725,190,82,12); ctx.fill(); ctx.font='700 56px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillStyle='#ff4040'; ctx.shadowColor='rgba(255,40,40,.9)'; ctx.shadowBlur=14; ctx.fillText((Math.floor(t*1.5)%2)?CLOCK:CLOCK.replace(':',' '),470,785); ctx.shadowBlur=0;
  // interior floor
  const fg=ctx.createLinearGradient(0,1140,0,1660); fg.addColorStop(0,'#2e2721'); fg.addColorStop(1,'#1c1815'); ctx.fillStyle=fg; ctx.fillRect(-600,1140,W+1200,560);
}
function miniStudent(x,y,t,ph,k){ // calm students, facing camera, tiny
  ctx.save(); ctx.translate(x,y+Math.sin(t*(k==='phones'?4.2:1)+ph)*(k==='phones'?4:1.5));
  ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.fillStyle=SKIN; ctx.beginPath(); ctx.arc(0,-34,22,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,50); ctx.stroke();
  const blink=hash(Math.floor(t*1.3+ph*7))<.12; ctx.fillStyle=INK;
  if(!blink){ ctx.beginPath(); ctx.arc(-7,-32,2.6,0,7); ctx.arc(7,-32,2.6,0,7); ctx.fill(); } else { ctx.fillRect(-11,-33,8,2); ctx.fillRect(3,-33,8,2); }
  ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,-26,6,.2,Math.PI-.2); ctx.stroke();
  if(k==='phones'){ ctx.lineWidth=6; ctx.strokeStyle='#222'; ctx.beginPath(); ctx.arc(0,-36,26,Math.PI*1.05,Math.PI*1.95); ctx.stroke(); ctx.fillStyle='#222'; rrect(-30,-44,10,20,4); ctx.fill(); rrect(20,-44,10,20,4); ctx.fill(); }
  ctx.strokeStyle=INK; ctx.lineWidth=5; const ty=k==='laptop'?Math.sin(t*14+ph)*3:0;
  ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(-24,30); ctx.lineTo(-18,48+ty); ctx.moveTo(0,4); ctx.lineTo(24,30); ctx.lineTo(18,48-ty); ctx.stroke();
  if(k==='read'){ ctx.fillStyle='#e9e4d8'; ctx.fillRect(-26,30,52,20); }
  ctx.restore();
}

// ================= JOÃO =================
function drawJoao(t,P){
  const sh=P.shake||0, sx=(noise1(t*25)-.5)*sh, sy=(noise1(t*25+40)-.5)*sh;
  const hx=540+sx+(P.dx||0), hy=1080+sy+(P.dy||0), r=95;
  // chair (bordeaux, like the photos)
  ctx.fillStyle='#6d1a26'; rrect(415,1150,250,200,26); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.06)'; rrect(425,1160,60,180,20); ctx.fill();
  // torso
  ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=14;
  ctx.beginPath(); ctx.moveTo(540+sx*.4,hy+r-6); ctx.lineTo(540,1345); ctx.stroke();
  P._h=[hx,hy,r];
  if(!P.armsFront) drawArms(P,hx,hy,r);
  drawHead(t,P,hx,hy,r);
}
function drawArms(P,hx,hy,r){
  const shY=hy+r+38; ctx.strokeStyle=INK; ctx.lineWidth=13; ctx.lineCap='round'; ctx.lineJoin='round';
  for(const side of ['L','R']){ const a=P.arms[side]; const s=[540+(side==='L'?-6:6)+(hx-540)*.4,shY];
    ctx.beginPath(); ctx.moveTo(s[0],s[1]); ctx.lineTo(a.e[0],a.e[1]); ctx.lineTo(a.h[0],a.h[1]); ctx.stroke();
    ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(a.h[0],a.h[1],a.fist?17:13,0,7); ctx.fill(); }
}
function drawHead(t,P,hx,hy,r){
  ctx.save(); ctx.translate(hx,hy); ctx.rotate(P.tilt||0);
  ctx.fillStyle=SKIN; ctx.strokeStyle=INK; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.stroke();
  const lx=(P.look||[0,0])[0], ly=(P.look||[0,0])[1];
  // olheiras (dark circles) — always
  ctx.fillStyle='rgba(95,60,120,.45)'; for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*34,22,26,12,0,0,Math.PI); ctx.fill(); }
  ctx.strokeStyle='rgba(80,45,100,.7)'; ctx.lineWidth=4; for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(s*34,10,24,.35,Math.PI-.35); ctx.stroke(); }
  const E=P.eyes||'normal'; ctx.fillStyle=INK; ctx.strokeStyle=INK;
  const blink=E==='blink';
  for(const s of [-1,1]){ const ex=s*34, ey=-4;
    if(blink){ ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(ex-15,ey); ctx.lineTo(ex+15,ey); ctx.stroke(); continue; }
    if(E==='wide'||E==='tear'||E==='plead'){ const R=E==='wide'?27:23; ctx.fillStyle='#fff'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(ex,ey,R,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(ex+lx*8,ey+ly*8,E==='wide'?6:11,0,7); ctx.fill();
      if(E!=='wide'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+lx*8-4,ey+ly*8-5,4,0,7); ctx.fill();
        ctx.fillStyle='rgba(120,190,255,.55)'; ctx.beginPath(); ctx.ellipse(ex,ey+14,R-4,7,0,0,Math.PI); ctx.fill(); }
      continue; }
    if(E==='droopy'){ ctx.beginPath(); ctx.arc(ex+lx*6,ey+4,9,0,7); ctx.fill(); ctx.fillStyle=SKIN; ctx.fillRect(ex-16,ey-14,32,16); ctx.fillStyle=INK; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(ex-16,ey+2); ctx.lineTo(ex+16,ey+2); ctx.stroke(); continue; }
    const big=(E==='confused'&&s>0)?1.6:1; ctx.beginPath(); ctx.arc(ex+lx*7,ey+ly*7,9*big,0,7); ctx.fill();
    if(E==='determined'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+lx*7-3,ey+ly*7-3,3,0,7); ctx.fill(); ctx.fillStyle=INK; }
  }
  // brows
  const b=P.brows||0; ctx.lineWidth=7; ctx.strokeStyle=INK;
  for(const s of [-1,1]){ let bb=b; if(E==='confused') bb=s>0?.5:-.1; ctx.beginPath(); ctx.moveTo(s*14,-38-bb*14); ctx.lineTo(s*54,-38+bb*14); ctx.stroke(); }
  // mouth
  const M=P.mouth||'flat'; ctx.lineWidth=6;
  if(M==='flat'){ ctx.beginPath(); ctx.moveTo(-20,44); ctx.lineTo(20,44); ctx.stroke(); }
  else if(M==='wobble'){ ctx.beginPath(); for(let i=0;i<=20;i++){ const x=-28+i*2.8, y=46+Math.sin(i*1.2+t*30)*4; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); }
  else if(M==='o'){ ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0,48,12,16,0,0,7); ctx.fill(); }
  else if(M==='scream'){ ctx.fillStyle='#3a0d12'; ctx.beginPath(); ctx.ellipse(0,50,26,30,0,0,7); ctx.fill(); ctx.stroke(); ctx.fillStyle='#e05a6a'; ctx.beginPath(); ctx.ellipse(0,66,14,8,0,0,7); ctx.fill(); }
  else if(M==='grit'){ ctx.fillStyle='#fff'; rrect(-30,34,60,24,6); ctx.fill(); ctx.stroke(); ctx.lineWidth=3; for(const x of [-15,0,15]){ ctx.beginPath(); ctx.moveTo(x,34); ctx.lineTo(x,58); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(-30,46); ctx.lineTo(30,46); ctx.stroke(); }
  else if(M==='sad'){ ctx.beginPath(); ctx.arc(0,62,20,Math.PI+.4,-.4); ctx.stroke(); }
  // headband (modo guerreiro)
  if(P.headband){ const p=P.headband; ctx.save(); ctx.translate(0,lerp(-260,0,easeOut(p)));
    ctx.beginPath(); ctx.arc(0,0,r+2,0,7); ctx.clip(); ctx.fillStyle='#e01b2a'; ctx.fillRect(-r-10,-78,2*r+20,30);
    ctx.fillStyle='#fff'; ctx.font='900 24px "Inter Display"'; ctx.textAlign='center'; ctx.fillText('CF I',0,-55); ctx.restore();
    ctx.save(); ctx.translate(0,lerp(-260,0,easeOut(p))); ctx.fillStyle='#e01b2a'; ctx.beginPath(); ctx.arc(r-4,-62,13,0,7); ctx.fill();
    for(const k of [0,1]){ ctx.beginPath(); ctx.moveTo(r-4,-66); const w=Math.sin(t*16+k*2)*16; ctx.quadraticCurveTo(r+50,-80+k*30+w,r+110,-70+k*40-w); ctx.lineTo(r+104,-52+k*40-w); ctx.quadraticCurveTo(r+46,-58+k*30+w,r-4,-54); ctx.fill(); }
    ctx.restore(); }
  ctx.restore();
  // sweat drops
  if(P.sweat){ for(let i=0;i<3;i++){ const k=((t*.9+i*.37)%1); const x=hx+(i===1?-r+6:r-8)+(i===2?-14:0), y=hy-30+k*110; ctx.globalAlpha=1-k*.6;
    ctx.fillStyle='#7cc6ff'; ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y-18); ctx.quadraticCurveTo(x+11,y,x,y+8); ctx.quadraticCurveTo(x-11,y,x,y-18); ctx.fill(); ctx.stroke(); ctx.globalAlpha=1; } }
  // tears
  if(P.tears){ for(let i=0;i<6;i++){ const k=((t*1.3+i/6)%1); for(const s of [-1,1]){ ctx.fillStyle=`rgba(110,185,255,${1-k})`; ctx.beginPath(); ctx.arc(hx+s*(40+k*30*s*s),hy+20+k*170,6,0,7); ctx.fill(); } } }
  // question marks / steam / zzz decorations
  if(P.qmarks){ ctx.font='900 64px "Inter Display"'; ctx.textAlign='center'; for(let i=0;i<3;i++){ const k=((t*.8+i/3)%1); ctx.globalAlpha=Math.sin(k*Math.PI); ctx.fillStyle=['#ffd23f','#fff','#ff6b6b'][i]; ctx.fillText('?',hx-110+i*110+Math.sin(t*3+i)*10,hy-r-30-k*90); } ctx.globalAlpha=1; }
  if(P.steam){ for(let i=0;i<8;i++){ const k=((t*1.6+i/8)%1); ctx.fillStyle=`rgba(235,235,235,${.55*(1-k)})`; ctx.beginPath(); ctx.arc(hx+(i%2?-50:50)+Math.sin(k*6+i)*20,hy-r-k*190,18+k*32,0,7); ctx.fill(); } }
  if(P.zap){ ctx.strokeStyle='#ffe04a'; ctx.lineWidth=7; for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+t*2; ctx.beginPath(); ctx.moveTo(hx+Math.cos(a)*(r+24),hy+Math.sin(a)*(r+24)); ctx.lineTo(hx+Math.cos(a+.1)*(r+60),hy+Math.sin(a+.1)*(r+60)); ctx.lineTo(hx+Math.cos(a-.05)*(r+80),hy+Math.sin(a-.05)*(r+80)); ctx.stroke(); } }
}

// ================= DESK (João's table: chaos) =================
function drawDesk(t,P){
  // lamp posts + linear lamp bar (as in the photos)
  ctx.fillStyle='#9a9ea4'; ctx.fillRect(84,880,12,460); ctx.fillRect(984,880,12,460);
  ctx.fillStyle='#c8ccd1'; rrect(64,860,952,30,6); ctx.fill(); ctx.fillStyle='#fff5dc'; ctx.fillRect(74,888,932,6);
  const lg=ctx.createLinearGradient(0,890,0,1460); lg.addColorStop(0,'rgba(255,236,190,.28)'); lg.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(74,894); ctx.lineTo(1006,894); ctx.lineTo(1090,1460); ctx.lineTo(-10,1460); ctx.closePath(); ctx.fill();
  // table top (light wood)
  const tg=ctx.createLinearGradient(0,1330,0,1450); tg.addColorStop(0,'#cfae80'); tg.addColorStop(1,'#e2c497'); ctx.fillStyle=tg;
  ctx.beginPath(); ctx.moveTo(60,1330); ctx.lineTo(1020,1330); ctx.lineTo(1090,1450); ctx.lineTo(-10,1450); ctx.closePath(); ctx.fill();
  glow(540,1390,480,'rgba(255,240,200,A)',.25);
  ctx.fillStyle='#a3825a'; ctx.fillRect(-10,1450,1100,34); ctx.fillStyle='#7d8086'; ctx.fillRect(30,1484,22,170); ctx.fillRect(1028,1484,22,170);
  // CF I book
  ctx.save(); ctx.translate(150,1365); ctx.rotate(-.12); ctx.fillStyle='#1d3f74'; rrect(-85,-30,170,62,6); ctx.fill(); ctx.fillStyle='#f2efe6'; ctx.fillRect(-85,22,170,10);
  ctx.fillStyle='#fff'; ctx.font='900 28px "Inter Display"'; ctx.textAlign='center'; ctx.fillText('CF I',0,8); ctx.restore();
  // scattered papers
  const papers=[[300,1400,.25],[420,1350,-.2],[700,1420,.15],[620,1360,-.4],[240,1440,-.1],[820,1440,.3]];
  papers.forEach(([x,y,a],i)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.sin(t*.5+i)*.004); ctx.fillStyle=i%2?'#f6f4ee':'#eeeadf'; ctx.fillRect(-70,-24,140,48);
    ctx.strokeStyle='rgba(60,60,90,.35)'; ctx.lineWidth=2; for(let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(-60,-14+k*10); ctx.lineTo(50-hash(i+k)*40,-14+k*10); ctx.stroke(); } ctx.restore(); });
  const extra=Math.floor((P.mess||0)*8); for(let i=0;i<extra;i++){ ctx.save(); ctx.translate(140+hash(i+40)*720,1345+hash(i+50)*95); ctx.rotate((hash(i+60)-.5)*1.4); ctx.fillStyle='#f1eee4'; ctx.fillRect(-60,-20,120,40); ctx.restore(); }
  // calculator
  ctx.save(); ctx.translate(950,1385); ctx.rotate(.18); ctx.fillStyle='#24262b'; rrect(-36,-30,72,60,8); ctx.fill(); ctx.fillStyle='#9fc3a0'; ctx.fillRect(-28,-24,56,14); ctx.restore();
  // coffee tower
  const n=P.cups||6, cx=860, sway=Math.sin(t*2.2)*(n>6?.025:.012);
  ctx.save(); ctx.translate(cx,1405); ctx.rotate(sway);
  for(let i=0;i<n;i++){ const y=-i*50; ctx.fillStyle='#f4f1ea'; ctx.beginPath(); ctx.moveTo(-26,y); ctx.lineTo(26,y); ctx.lineTo(33,y-52); ctx.lineTo(-33,y-52); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#8a5a33'; ctx.fillRect(-29,y-34,58,16); }
  ctx.restore();
  // energy can
  ctx.fillStyle='#2fd06a'; rrect(760,1360,34,58,6); ctx.fill(); ctx.fillStyle='#111'; ctx.fillRect(760,1380,34,8);
}

// ================= GLASS WALL + CORRIDOR =================
let smearA=0;
function drawGlass(t){
  ctx.fillStyle='rgba(120,140,190,.05)'; ctx.fillRect(-600,-600,W+1200,H+1200);
  ctx.fillStyle='rgba(255,255,255,.035)'; for(const [x,w] of [[-120,140],[300,60],[640,180],[1000,90]]){ ctx.beginPath(); ctx.moveTo(x,-100); ctx.lineTo(x+w,-100); ctx.lineTo(x+w-500,1700); ctx.lineTo(x-500,1700); ctx.closePath(); ctx.fill(); }
  // face imprint left on the glass
  if(smearA>0){ ctx.save(); ctx.globalAlpha=smearA; ctx.fillStyle='rgba(235,240,255,.22)'; ctx.beginPath(); ctx.ellipse(800,960,95,80,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(235,240,255,.3)'; ctx.beginPath(); ctx.ellipse(800,995,40,17,0,0,7); ctx.fill(); for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(800+s*150,985,30,40,0,0,7); ctx.fill(); }
    ctx.strokeStyle='rgba(235,240,255,.22)'; ctx.lineWidth=5; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(755+i*22,1035); ctx.lineTo(757+i*22,1080+hash(i)*40); ctx.stroke(); } ctx.restore(); }
  // calendar taped on the glass
  ctx.save(); ctx.translate(790,720); ctx.rotate(.06); ctx.fillStyle='#fbfaf5'; ctx.fillRect(-150,-110,300,230);
  ctx.fillStyle='#d61e2b'; ctx.fillRect(-150,-110,300,58); ctx.fillStyle='#fff'; ctx.font='900 38px "Inter Display"'; ctx.textAlign='center'; ctx.fillText('EXAME CF I',0,-66);
  ctx.fillStyle='#222'; ctx.font='800 28px "Inter"'; ctx.fillText('FALTAM',0,-14); ctx.fillStyle='#d61e2b'; ctx.font='900 76px "Inter Display"'; ctx.fillText('5 DIAS',0,64);
  ctx.strokeStyle='#d61e2b'; ctx.lineWidth=3; for(let i=0;i<5;i++){ ctx.strokeRect(-120+i*50,84,36,24); } ctx.font='900 26px "Inter"'; ctx.fillText('✗',-102,104);
  ctx.fillStyle='rgba(240,230,170,.75)'; ctx.save(); ctx.rotate(-.5); ctx.fillRect(-120,-100,70,22); ctx.restore(); ctx.save(); ctx.translate(140,-100); ctx.rotate(.5); ctx.fillRect(-35,-11,70,22); ctx.restore(); ctx.restore();
  // mullions & sill (metal frames)
  const mg='#2f3238';
  for(const x of [-560,-10,1060,1610]){ ctx.fillStyle=mg; ctx.fillRect(x,-600,32,2300); ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(x+4,-600,4,2300); }

  if(!boom){ const tgt=last?keyPos(last[0]):[700,1500]; const nxt=seq.find(s=>s[1]>lt); const np=nxt?keyPos(nxt[0]):tgt; const f=last&&nxt?ease(clamp((lt-last[1])/(nxt[1]-last[1]))):1;
    const hx=lerp(tgt[0],np[0],f), hy=lerp(tgt[1],np[1],f)-(1-Math.abs(f*2-1))*40+30; stickHand(hx,hy,hx+600,hy+700); }
  if(boom){ for(let i=0;i<10;i++){ const k=((lt-2)*.9+i/10)%1; ctx.fillStyle=`rgba(60,60,60,${.6*(1-k)})`; ctx.beginPath(); ctx.arc(540+(hash(i)-.5)*400+Math.sin(k*5+i)*40,950-k*500,40+k*90,0,7); ctx.fill(); } }
  ctx.restore();

}
// Balanço: Ativo vs Passivo + Capital Próprio — não bate por 1 cêntimo
function insertBalanca(t,lt){
  ctx.save(); cam(1,540,960,lt>1.3&&lt<1.7?22:2,t); warmBG(t);
  const piv=[540,760]; let a=-.06+Math.sin(lt*3)*.015;
  if(lt>1.25){ const k=lt-1.25; a=.42-.5*Math.exp(-k*5)*Math.cos(k*16); }
  // base + post
  ctx.fillStyle='#b8a06a'; ctx.beginPath(); ctx.moveTo(400,1500); ctx.lineTo(680,1500); ctx.lineTo(600,1440); ctx.lineTo(480,1440); ctx.fill(); ctx.fillRect(525,780,30,665);
  // beam
  ctx.save(); ctx.translate(...piv); ctx.rotate(a); ctx.fillStyle='#d9c27e'; rrect(-400,-14,800,28,14); ctx.fill(); ctx.restore();
  ctx.fillStyle='#e8d08a'; ctx.beginPath(); ctx.arc(...piv,26,0,7); ctx.fill();
  const ends=[-1,1].map(s=>[piv[0]+Math.cos(a)*380*s, piv[1]+Math.sin(a)*380*s]);
  const labels=[['ATIVO','12 500,00 €','#2e9e5b'],['PASSIVO + CP','12 499,99 €','#c0392b']];
  ends.forEach(([ex,ey],i)=>{ const py=ey+300; ctx.strokeStyle='#8c7a4a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-150,py); ctx.moveTo(ex,ey); ctx.lineTo(ex+150,py); ctx.stroke();
    // sign standing on the pan
    ctx.fillStyle='#fbfaf5'; rrect(ex-150,py-150,300,140,16); ctx.fill(); ctx.textAlign='center'; ctx.font='900 40px "Inter Display"'; ctx.fillStyle=labels[i][2]; ctx.fillText(labels[i][0],ex,py-95); ctx.font='800 40px "JetBrains Mono"'; ctx.fillStyle='#222'; ctx.fillText(labels[i][1],ex,py-40);
    if(i===1&&lt>1.25){ ctx.fillStyle='#f4f1ea'; ctx.beginPath(); ctx.moveTo(ex+60,py-150); ctx.lineTo(ex+110,py-150); ctx.lineTo(ex+118,py-215); ctx.lineTo(ex+52,py-215); ctx.fill(); ctx.fillStyle='#8a5a33'; ctx.fillRect(ex+54,py-195,62,16); }
    ctx.fillStyle='#d9c27e'; ctx.beginPath(); ctx.ellipse(ex,py,170,34,0,0,Math.PI); ctx.fill(); ctx.fillRect(ex-170,py-4,340,8); });
  // João's hand brings a coffee cup to "balance" it
  if(lt>.5&&lt<1.6){ const k=ease(prog(lt,.5,1.2)); const [ex,ey]=ends[1]; const hx=lerp(1200,ex+85,k), hy=lerp(700,ey+300-235,k);
    if(lt<1.25){ ctx.fillStyle='#f4f1ea'; ctx.beginPath(); ctx.moveTo(hx-25,hy+80); ctx.lineTo(hx+25,hy+80); ctx.lineTo(hx+33,hy+15); ctx.lineTo(hx-33,hy+15); ctx.fill(); ctx.fillStyle='#8a5a33'; ctx.fillRect(hx-31,hy+35,62,16); }
    stickHand(hx,hy,hx+500,hy-400); }
  ctx.restore();
  if(lt<1.25&&lt>.1) popLabel('−0,01 €',540,520,lt-.1,'#ff6b6b',.05);
  if(lt>1.45) stamp('O BALANÇO\nNÃO BATE!',lt-1.45,560,100,-.12);
}
// Inventários: FIFO vs LIFO (LIFO não é permitido no SNC — NCRF 18)
function insertFIFO(t,lt){
  ctx.save(); cam(1,540,960,lt>1.2&&lt<1.5?24:(lt>2.1&&lt<2.5?30:2),t); warmBG(t);
  ctx.fillStyle='#fbfaf5'; ctx.save(); ctx.translate(540,600); ctx.rotate(-.02); rrect(-360,-80,720,160,20); ctx.fill(); ctx.textAlign='center'; ctx.fillStyle='#222'; ctx.font='900 50px "Inter Display"'; ctx.fillText('Inventário — FIFO',0,-8); ctx.font='600 32px "Inter"'; ctx.fillStyle='#666'; ctx.fillText('(First In, First Out)',0,44); ctx.restore();
  const lots=[['LOTE 1','JAN · 10 €'],['LOTE 2','FEV · 11 €'],['LOTE 3','MAR · 12 €'],['LOTE 4','ABR · 13 €']];
  const collapse=prog(lt,2.1,2.7);
  lots.forEach(([a,b],i)=>{ let x=540, y=1500-90-i*175, r=0;
    if(i===3){ const k=ease(prog(lt,.4,1.0)); y-=k*130; x+=k*60; }
    if(collapse>0){ const g=collapse*collapse; x+=(i-1.2)*170*collapse+(i===3?150*collapse:0); r=(i-1.5)*.7*collapse; y=lerp(y,1500-90-(i%2)*60,Math.min(1,g*1.3)); }
    ctx.save(); ctx.translate(x,y); ctx.rotate(r); ctx.fillStyle=['#b98b4f','#a77b44','#c49758','#ad8048'][i]; rrect(-170,-85,340,170,10); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-170,-30); ctx.lineTo(170,-30); ctx.stroke(); ctx.fillStyle='#e9d9a8'; ctx.fillRect(-30,-85,60,55);
    ctx.textAlign='center'; ctx.fillStyle='#2a1a0a'; ctx.font='900 42px "Inter Display"'; ctx.fillText(a,0,22); ctx.font='700 30px "Inter"'; ctx.fillText(b,0,62); ctx.restore(); });
  if(lt<.4){ ctx.font='900 40px "Inter"'; ctx.fillStyle='#ffd23f'; ctx.textAlign='left'; ctx.fillText('← sai primeiro',740,1430); }
  if(lt>.3&&lt<1.4){ const k=ease(prog(lt,.3,.6)); const hx=lerp(1150,560,k), hy=lerp(700,1500-90-3*175-90-ease(prog(lt,.4,1.0))*130,k); stickHand(hx,hy,hx+500,hy-500); }
  ctx.restore();
  if(lt>1.2) stamp('LIFO?!\nPROIBIDO NO SNC',lt-1.2,800,92,-.1);
  if(lt>2.4) popLabel('(NCRF 18)',540,1090,lt-2.4,'#fff',.04);
}

// Slot machine do Plano de Contas (pensamento do João)
const ACC=['11 · Caixa','12 · Depósitos','21 · Clientes','22 · Fornecedores','24 · Estado','31 · Compras','62 · FSE','71 · Vendas'];
function slotBubble(t,lt){
  const a=clamp(lt/.3); if(a<=0) return; ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle='#fff'; for(const [x,y,r] of [[560,960,14],[590,915,20],[620,860,26]]){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  const s=back(clamp(lt/.4)); ctx.translate(540,650); ctx.scale(s,s);
  ctx.fillStyle='#fff'; for(const [x,y,r] of [[-230,-40,110],[-110,-110,120],[40,-120,125],[190,-60,115],[240,60,95],[100,120,115],[-80,125,110],[-230,80,100],[0,0,170]]){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  ctx.textAlign='center'; ctx.fillStyle='#111'; ctx.font='900 46px "Inter Display"'; ctx.fillText('Conta 22 = ?',0,-120);
  ctx.fillStyle='#1b1d22'; rrect(-260,-75,520,150,22); ctx.fill();
  ctx.save(); rrect(-250,-65,500,130,16); ctx.clip(); ctx.fillStyle='#fff7e0'; ctx.fillRect(-250,-65,500,130);
  const stopAt=2.6; const items=ACC.concat(['CAFÉ ☕']); const N=items.length;
  // decelerating reel that lands on the last item (CAFÉ)
  const total=N*3-1; const k=clamp(lt/stopAt); const pos=total*(1-Math.pow(1-k,3));
  const base=Math.floor(pos);
  for(let i=-1;i<=1;i++){ const idx=base+i, off=i-(pos-base); const label=items[((idx%N)+N)%N];
    ctx.font='900 58px "Inter Display"'; ctx.fillStyle=label.startsWith('CAFÉ')?'#8a5a33':'#1d3f74'; ctx.fillText(label,0,20+off*110); }
  const g=ctx.createLinearGradient(0,-65,0,65); g.addColorStop(0,'rgba(0,0,0,.45)'); g.addColorStop(.3,'rgba(0,0,0,0)'); g.addColorStop(.7,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.45)'); ctx.fillStyle=g; ctx.fillRect(-250,-65,500,130);
  ctx.restore();
  if(lt>stopAt+.15){ const q=clamp((lt-stopAt-.15)/.15); ctx.save(); ctx.globalAlpha=a*q; ctx.strokeStyle='#e01b2a'; ctx.lineWidth=18; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-120,-60); ctx.lineTo(120,60); ctx.moveTo(120,-60); ctx.lineTo(-120,60); ctx.stroke();
    ctx.font='800 34px "Inter"'; ctx.fillStyle='#1c7c3c'; ctx.globalAlpha=a*clamp((lt-stopAt-.5)/.2); ctx.fillText('(era Fornecedores...)',0,135); ctx.restore(); }
  ctx.restore();
}
// Barra de energia: depreciação em quotas constantes
function energyBar(t,lt){
  const steps=Math.min(4,Math.floor(lt/.6)); const v=1-steps*.2; const flash=(lt%.6)<.15&&steps>0;
  ctx.save(); ctx.translate(260,1545); ctx.fillStyle='rgba(0,0,0,.72)'; rrect(0,0,560,118,18); ctx.fill();
  ctx.font='900 30px "Inter Display"'; ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText('ENERGIA DO JOÃO',20,40);
  ctx.font='700 24px "Inter"'; ctx.fillStyle='#ffd23f'; ctx.fillText('Depreciação: −20%/h (quotas constantes)',20,74);
  ctx.fillStyle='#333'; rrect(20,86,520,20,10); ctx.fill(); ctx.fillStyle=v>.4?'#2ee07a':(v>.2?'#ffb03a':'#ff3b4f'); rrect(20,86,520*v,20,10); ctx.fill();
  if(flash){ ctx.font='900 40px "Inter Display"'; ctx.fillStyle='#ff3b4f'; ctx.textAlign='right'; ctx.fillText('−20%',540,46); }
  ctx.restore();
}
// Time-lapse: 02:47 -> 04:12, a torre de cafés cresce
function timelapse(t,lt){
  const k=clamp(lt/2.6); const m=167+Math.floor(85*k); CLOCK=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const pose=Math.floor(lt/.33)%4; let P={arms:restArms(),eyes:'normal',mouth:'flat',cups:7+Math.floor(k*3.99),sweat:true,mess:k};
  if(pose===0){ P.arms={L:{e:[400,1180],h:[465,1040]},R:{e:[680,1180],h:[615,1040]}}; P.eyes='wide'; P.mouth='scream'; }
  if(pose===1){ P.dy=150; P.tilt=.5; P.eyes='blink'; P.mouth='o'; }
  if(pose===2){ P.eyes='droopy'; P.mouth='wobble'; P.steam=true; }
  if(pose===3){ P.eyes='determined'; P.brows=-.4; P.arms.R={e:[700,1290],h:[640+Math.sin(t*60)*30,1380]}; }
  ctx.save(); cam(1.12,540,1010,0,t); world(t,P); ctx.restore();
  ctx.save(); ctx.font='900 48px "JetBrains Mono"'; ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.globalAlpha=Math.floor(t*4)%2?1:.6; ctx.fillText('▶▶ x60',70,500); ctx.restore();
  energyBar(t,lt);
  for(let i=0;i<10;i++){ ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=3; const y=hash(i+Math.floor(t*20))*H; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

// ================= TIMELINE (45 s) =================
const SEG={hook:0,pen:9,T:11.3,iva:13.8,bal:17,fifo:20.2,lapse:23.4,cafe:26.4,squish:29.3,plead:31.9,hud:37};
function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  smearA = t>SEG.plead+.6 ? .55 : 0; CLOCK = t<SEG.lapse?'02:47':'04:12';
  const after=t>=SEG.lapse; let P={arms:restArms(),eyes:'normal',mouth:'flat',cups:after?10:6,sweat:true,mess:after?1:0};
  const S2='...e o João não sabe distinguir um Débito de um Crédito.', S3='IVA? Balanço? Inventários? Tudo errado.', S4='04:12. Faltam 5 dias. Nada bate certo.';

  if(t<SEG.pen){
    const blinkT=[1.2,1.35,2.1,2.25,6.5,6.62,8.1,8.22]; let bl=false; for(let i=0;i<blinkT.length;i+=2) if(t>blinkT[i]&&t<blinkT[i+1]) bl=true;
    P.eyes=bl?'blink':(t>1.5&&t<3?'confused':'normal'); P.look=t<3?[0,.6]:[Math.sin(t*.7)*.5,0]; P.qmarks=t>1.6&&t<3.2; P.brows=.3;
    P.paper=t<3.2?[540,1255]:null; if(P.paper){ P.arms={L:{e:[410,1300],h:[385,1260]},R:{e:[670,1300],h:[695,1260]}}; }
    P.mouth=t>1.6&&t<3?'wobble':'flat'; if(t>4.6&&t<8.9){ P.look=[.5,-.7]; P.brows=.5; } if(t>7.4&&t<8.9){ P.mouth='wobble'; P.arms={L:{e:[400,1230],h:[380,1170]},R:{e:[680,1230],h:[700,1170]}}; }
    let z,cy; if(t<3){ z=lerp(2.6,2.45,t/3); cy=1185; } else { const p=ease(prog(t,3,3.6)); z=lerp(2.45,1.0,p)+lerp(0,.07,prog(t,3.6,9)); cy=lerp(1185,960,p); }
    ctx.save(); cam(z,540,cy,0,t); world(t,P); ctx.restore();
    if(t>4.6&&t<8.9) slotBubble(t,t-4.6);
    sticker('Faltam 5 dias para o exame de CF I no ISCAC...',330,t-.3,8.6,{type:1.2});
  }
  else if(t<SEG.T){ insertPen(t,t-SEG.pen); sticker(S2,330,t-SEG.pen-.2,4.6,{type:1.4}); }
  else if(t<SEG.iva){ insertT(t,t-SEG.T); sticker(S2,330,t-SEG.pen-.2,4.6,{type:1.4}); }
  else if(t<SEG.bal){ insertIVA(t,t-SEG.iva); sticker(S3,330,t-SEG.iva-.1,9.4,{type:1.2}); }
  else if(t<SEG.fifo){ insertBalanca(t,t-SEG.bal); sticker(S3,330,t-SEG.iva-.1,9.4,{type:1.2}); }
  else if(t<SEG.lapse){ insertFIFO(t,t-SEG.fifo); sticker(S3,330,t-SEG.iva-.1,9.4,{type:1.2}); }
  else if(t<SEG.cafe){ timelapse(t,t-SEG.lapse); sticker(S4,330,t-SEG.lapse-.1,8.4,{type:1.0}); }
  else if(t<SEG.squish){ const lt=t-SEG.cafe;
    if(lt<1.1){ const p=ease(prog(lt,0,.45)); P.cup=[lerp(860,610,p),lerp(930,1110,p),lerp(0,-2.2,prog(lt,.45,.8))]; P.arms.R={e:[lerp(720,700,p),lerp(1150,1230,p)],h:[lerp(830,610,p),lerp(950,1140,p)]};
      P.tilt=-.25*prog(lt,.4,.7); P.mouth='o'; P.eyes='blink'; P.cups=9; }
    else if(lt<2.1){ P.eyes='wide'; P.mouth='grit'; P.shake=26; P.zap=true; P.cups=10; P.brows=-.2; }
    else { P.eyes='droopy'; P.mouth='flat'; P.cups=10; const k=prog(lt,2.1,2.9); P.dy=Math.pow(k,3)*40; P.tilt=Math.sin(lt*6)*.06; }
    const lk=prog(lt,2.55,2.9); const z=lerp(1.75,1.75+lk*6,easeOut(lk)*lk); ctx.save(); cam(z,560,lerp(1180,1100,lk),lt>1.1&&lt<2.1?12:0,t); world(t,P); ctx.restore();
    if(lt<1.1&&lt>.5) popLabel('GLUP GLUP',540,1600,lt-.5,'#ffb03a',.06);
    if(lt>1.1&&lt<2.1) popLabel('CAFEÍNA 300%',540,1600,lt-1.1,'#ffe04a',-.05);
    sticker(S4,330,t-SEG.lapse-.1,8.4,{type:1.0});
    if(lt>2.82){ ctx.fillStyle=`rgba(255,255,255,${clamp((lt-2.82)/.08)})`; ctx.fillRect(0,0,W,H); } }
  else if(t<SEG.plead){ const lt=t-SEG.squish; squish(t,lt,0); if(lt<.12){ ctx.fillStyle=`rgba(255,255,255,${1-lt/.12})`; ctx.fillRect(0,0,W,H); }
    popLabel('PUM!',540,560,lt,'#fff',-.1); if(lt>.9) popLabel('*squeeeak*',540,1700,lt-.9,'#9fe3ff',.04);
    sticker(S4,330,t-SEG.lapse-.1,8.4,{type:1.0}); }
  else if(t<SEG.hud){ const lt=t-SEG.plead;
    if(lt<.6){ squish(t,2.6+lt*.2,easeOut(lt/.6)); popLabel('*plop*',540,1600,lt,'#fff',.05); }
    else { P.eyes='plead'; P.tears=true; P.brows=.7; P.mouth=lt>2.5?'wobble':'sad'; P.look=[0,0]; P.sweat=false;
      const sh=Math.sin(lt*8)*6; P.arms={L:{e:[425,1300],h:[527,1265+sh]},R:{e:[655,1300],h:[553,1265+sh]}}; P.dx=Math.sin(lt*30)*2;
      ctx.save(); cam(lerp(1.55,1.95,ease(prog(lt,.6,4.9))),540,1130,0,t); world(t,P); ctx.restore(); }
    sticker('Ele não vai sobreviver sozinho. O futuro dele está nas vossas mãos!',330,lt-.1,5,{type:1.5}); }
  else { const lt=t-SEG.hud;
    const target=lt<1.3?-1:Math.floor((lt-1.3)/.6)%3;
    P.headband=prog(lt,.15,.7); P.eyes='determined'; P.brows=-.55; P.mouth=lt<.8?'grit':'scream'; P.sweat=false; P.look=[.6,-.6];
    const ty=target<0?300:ROW_Y[target]+80-260; const sh=[595,1213]; const ang=Math.atan2(ty-sh[1],(target<0?900:1000)-sh[0]); const jig=Math.sin(lt*40)*14;
    P.arms={L:{e:[430,1180],h:[455,1100+Math.sin(lt*14)*24],fist:true},R:{e:[sh[0]+Math.cos(ang)*120,sh[1]+Math.sin(ang)*120+jig*.4],h:[sh[0]+Math.cos(ang)*235,sh[1]+Math.sin(ang)*235+jig]}};
    P.shake=lt>.8?6:0;
    ctx.save(); cam(1.0,540,700,lt>.75&&lt<1.0?30:0,t); world(t,P); ctx.restore();
    ctx.fillStyle=`rgba(0,0,10,${.55*prog(lt,0,.6)})`; ctx.fillRect(0,0,W,H);
    ctx.save(); cam(1.0,540,700,lt>.75&&lt<1.0?30:0,t); ctx.globalAlpha=prog(lt,0,.6); glow(540,1080,420,'rgba(255,60,60,A)',.25); drawJoao(t,P); drawArms(P,...P._h); ctx.restore();
    if(lt>.75&&lt<1.05){ ctx.fillStyle=`rgba(255,240,120,${.6*(1-(lt-.75)/.3)})`; ctx.fillRect(0,0,W,H); }
    if(lt>.75&&lt<1.6) popLabel('LEVEL UP!',540,1720,lt-.75,'#ffe04a',-.06);
    hud(t,lt,target);
    if(lt<5.6) sticker('O que fizerem neste vídeo dita o estudo de amanhã. Quantos lançamentos ele faz hoje?',1070,lt-1.9,3.7,{size:44,type:1.0,bg:'#ffd23f'});
    else { sticker('SEGUE para veres se ele sobrevive ao DIA 2 →',1090,lt-5.6,10,{size:46,type:.6,bg:'#ff2d55',fg:'#fff',weight:'900'}); }
  }
  ctx.save(); ctx.globalAlpha=.06; ctx.globalCompositeOperation='overlay'; ctx.drawImage(grains[Math.floor(t*24)%5],0,0,W,H); ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(t<.25){ ctx.fillStyle=`rgba(0,0,0,${1-t/.25})`; ctx.fillRect(0,0,W,H); }
}
window.DURATION=DURATION;
window.frame=t=>{ render(t); return cv.toDataURL('image/jpeg',.9); };
