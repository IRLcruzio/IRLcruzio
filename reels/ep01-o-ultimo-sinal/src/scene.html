<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const DURATION = 92;

// ---------- utils ----------
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
function hash(n){ const x=Math.sin(n*127.1)*43758.5453; return x-Math.floor(x); }
function noise1(x){ const i=Math.floor(x), f=x-i; const u=f*f*(3-2*f); return lerp(hash(i),hash(i+1),u); }

// ---------- pre-generated assets ----------
function makeSkyline(seed, n, minH, maxH, minW, maxW){
  const r=rng(seed); const b=[]; let x=-60;
  while(x<W+60){ const w=lerp(minW,maxW,r()); const h=lerp(minH,maxH,r());
    const broken=r()<.55; const pts=[];
    if(broken){ const k=3+Math.floor(r()*4); for(let i=0;i<=k;i++) pts.push([i/k, r()*0.18]); }
    const wins=[]; for(let i=0;i<Math.floor(h/60);i++) for(let j=0;j<Math.floor(w/40);j++) if(r()<.06) wins.push([j,i,r()]);
    b.push({x,w,h,broken,pts,wins}); x+=w+lerp(-10,20,r()); }
  return b;
}
const sky1=makeSkyline(11,0,380,820,90,200), sky2=makeSkyline(23,0,240,560,70,160), sky3=makeSkyline(37,0,140,330,60,140);
function drawSkyline(bs, baseY, color, winColor, scale=1){
  ctx.fillStyle=color;
  for(const b of bs){ const h=b.h*scale;
    ctx.beginPath(); ctx.moveTo(b.x,baseY);
    if(b.broken){ for(const [px,py] of b.pts) ctx.lineTo(b.x+px*b.w, baseY-h+py*h); }
    else { ctx.lineTo(b.x,baseY-h); ctx.lineTo(b.x+b.w,baseY-h); }
    ctx.lineTo(b.x+b.w,baseY); ctx.closePath(); ctx.fill();
    if(winColor){ for(const [j,i,v] of b.wins){ const wy=baseY-h+30+i*60; if(wy>baseY-20) continue; ctx.fillStyle=winColor.replace('A',(0.25+v*0.5).toFixed(2)); ctx.fillRect(b.x+12+j*40,wy,14,22);} ctx.fillStyle=color; }
  }
}
// grain textures
const grains=[]; for(let g=0;g<6;g++){ const c=document.createElement('canvas'); c.width=270;c.height=480; const x=c.getContext('2d'); const id=x.createImageData(270,480); const r=rng(100+g); for(let i=0;i<id.data.length;i+=4){ const v=r()*255; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;} x.putImageData(id,0,0); grains.push(c); }
// ash particles
const ash=[]; { const r=rng(5); for(let i=0;i<140;i++) ash.push({x:r()*W,y:r()*H,s:1+r()*3.5,v:20+r()*50,ph:r()*6.28,a:.25+r()*.6}); }
// darkness layer for flashlight
const dark=document.createElement('canvas'); dark.width=W; dark.height=H; const dctx=dark.getContext('2d');

// ---------- drawing primitives ----------
function sky(top, mid, bot){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(.55,mid); g.addColorStop(1,bot); ctx.fillStyle=g; ctx.fillRect(-200,-200,W+400,H+400); }
function smoke(t, x, baseY, seed, color){ const r=rng(seed);
  for(let i=0;i<26;i++){ const k=(i/26 + t*0.03 + r()*0.02)%1; const y=baseY-k*1300; const rad=40+k*220+r()*30; const xx=x+Math.sin(k*5+seed)*80*k + k*160;
    ctx.fillStyle=color.replace('A',(0.22*(1-k)).toFixed(3)); ctx.beginPath(); ctx.arc(xx,y,rad,0,7); ctx.fill(); } }
function drawAsh(t, color='rgba(220,200,190,A)', count=140){ for(let i=0;i<count;i++){ const p=ash[i]; const y=(p.y+t*p.v)%(H+40)-20; const x=(p.x+Math.sin(t*.7+p.ph)*30+t*12)%W; ctx.fillStyle=color.replace('A',p.a.toFixed(2)); ctx.beginPath(); ctx.arc(x,y,p.s,0,7); ctx.fill(); } }
function fog(t, y, h, color, speed=1){ for(let i=0;i<7;i++){ const x=((i*260+t*25*speed*(i%2?1:-0.7))%(W+600))-300; const g=ctx.createRadialGradient(x,y,0,x,y,h); g.addColorStop(0,color.replace('A','0.35')); g.addColorStop(1,color.replace('A','0')); ctx.fillStyle=g; ctx.fillRect(x-h,y-h,h*2,h*2);} }
function vignette(strength=.85){ const g=ctx.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.5,H*.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${strength})`); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
function grain(t, a=.07){ ctx.save(); ctx.globalAlpha=a; ctx.globalCompositeOperation='overlay'; ctx.drawImage(grains[Math.floor(t*24)%6],0,0,W,H); ctx.restore(); }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// Tomás from behind. (x,y)=feet center, s=scale (1 => ~600px tall)
function drawTomas(x,y,s,walk,t,opts={}){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  const body=opts.body||'#0b0d0a', jacket=opts.jacket||'#1d2418';
  const sw=Math.sin(walk)*1, bob=Math.abs(Math.sin(walk))*-8;
  ctx.translate(0,bob);
  // legs
  ctx.fillStyle=body;
  ctx.save(); ctx.translate(-34,-260); ctx.rotate(sw*0.18); ctx.fillRect(-26,0,52,262); ctx.fillRect(-30,240,62,30); ctx.restore();
  ctx.save(); ctx.translate(34,-260); ctx.rotate(-sw*0.18); ctx.fillRect(-26,0,52,262); ctx.fillRect(-30,240,62,30); ctx.restore();
  // torso (jacket)
  ctx.fillStyle=jacket; ctx.beginPath(); ctx.moveTo(-95,-270); ctx.lineTo(-108,-520); ctx.quadraticCurveTo(0,-575,108,-520); ctx.lineTo(95,-270); ctx.closePath(); ctx.fill();
  // arms
  ctx.save(); ctx.translate(-104,-500); ctx.rotate(0.08-sw*0.12); ctx.fillStyle=jacket; ctx.fillRect(-26,0,46,220); ctx.fillStyle=body; ctx.beginPath(); ctx.arc(-3,232,24,0,7); ctx.fill(); ctx.restore();
  // bat over right shoulder
  ctx.save(); ctx.translate(60,-470); ctx.rotate(0.5);
  ctx.fillStyle='#7a5330'; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.lineTo(20,-300); ctx.quadraticCurveTo(0,-330,-20,-300); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#b5b5b5'; ctx.lineWidth=4; for(let i=0;i<9;i++){ const yy=-150-i*17; ctx.beginPath(); ctx.moveTo(-18,yy); ctx.lineTo(18,yy-9); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-6,yy-4); ctx.lineTo(-10,yy-14); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.translate(104,-500); ctx.rotate(-0.12+sw*0.1); ctx.fillStyle=jacket; ctx.fillRect(-22,0,46,220); ctx.fillStyle=body; ctx.beginPath(); ctx.arc(1,232,24,0,7); ctx.fill(); ctx.restore();
  // backpack (red)
  const bp=opts.pack||'#8e1d17';
  ctx.fillStyle=bp; rrect(-80,-520,160,210,26); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.28)'; rrect(-62,-410,124,80,16); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.07)'; rrect(-80,-520,40,210,20); ctx.fill();
  // straps
  ctx.fillStyle='#2a0c09'; ctx.fillRect(-82,-530,18,40); ctx.fillRect(64,-530,18,40);
  // walkie-talkie (yellow) clipped to strap
  ctx.save(); ctx.translate(-92,-470); ctx.rotate(-0.08);
  ctx.fillStyle='#e0b21c'; rrect(-22,0,44,74,8); ctx.fill(); ctx.fillStyle='#1a1a1a'; ctx.fillRect(-12,-30,7,32);
  const led=(Math.sin(t*6)>0.3); ctx.fillStyle=led?'#ff2a2a':'#4a0a0a'; ctx.beginPath(); ctx.arc(10,12,6,0,7); ctx.fill();
  if(led){ ctx.fillStyle='rgba(255,40,40,.25)'; ctx.beginPath(); ctx.arc(10,12,18,0,7); ctx.fill(); }
  ctx.restore();
  // hood / head
  ctx.fillStyle=jacket; ctx.beginPath(); ctx.ellipse(0,-585,70,82,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,-560,52,48,0,0,7); ctx.fill();
  ctx.restore();
}
// Zombie silhouette. (x,y)=feet, s scale
function drawZombie(x,y,s,t,ph,color='#050607',eyes=true){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); const sway=Math.sin(t*1.6+ph);
  ctx.rotate(sway*0.06); ctx.fillStyle=color;
  ctx.save(); ctx.translate(-26,-250); ctx.rotate(sway*.15); ctx.fillRect(-22,0,40,252); ctx.restore();
  ctx.save(); ctx.translate(26,-250); ctx.rotate(-sway*.12+.08); ctx.fillRect(-18,0,40,240); ctx.restore();
  ctx.beginPath(); ctx.moveTo(-75,-250); ctx.lineTo(-85,-470); ctx.quadraticCurveTo(-10,-520,70,-480); ctx.lineTo(78,-250); ctx.closePath(); ctx.fill();
  // ragged edge
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(-75+i*25,-252); ctx.lineTo(-62+i*25,-215+hash(i+ph)*20); ctx.lineTo(-50+i*25,-252); ctx.fill(); }
  // arms forward (toward camera -> arms raised slightly, uneven)
  ctx.save(); ctx.translate(-78,-455); ctx.rotate(.35+sway*.2); ctx.fillRect(-16,0,30,230); ctx.restore();
  ctx.save(); ctx.translate(70,-460); ctx.rotate(-.6-sway*.15); ctx.fillRect(-14,0,30,250); ctx.restore();
  // head tilted
  ctx.save(); ctx.translate(-8,-520); ctx.rotate(.3+sway*.1); ctx.beginPath(); ctx.ellipse(0,0,46,58,0,0,7); ctx.fill();
  if(eyes){ const blink=(Math.sin(t*0.9+ph*3)>-0.95)?1:0; ctx.fillStyle=`rgba(255,${60+Math.floor(hash(ph)*80)},40,${0.9*blink})`; ctx.beginPath(); ctx.arc(-16,-6,6,0,7); ctx.arc(14,-4,6,0,7); ctx.fill();
    ctx.fillStyle=`rgba(255,80,40,${0.18*blink})`; ctx.beginPath(); ctx.arc(-1,-5,30,0,7); ctx.fill(); }
  ctx.restore(); ctx.restore();
}
function flashlight(cx,cy,tx,ty,spread,intensity=.94){
  dctx.globalCompositeOperation='source-over'; dctx.clearRect(0,0,W,H);
  dctx.fillStyle=`rgba(0,0,0,${intensity})`; dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='destination-out';
  const ang=Math.atan2(ty-cy,tx-cx), len=Math.hypot(tx-cx,ty-cy)*1.25;
  dctx.save(); dctx.translate(cx,cy); dctx.rotate(ang);
  const g=dctx.createRadialGradient(0,0,0,0,0,len); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.7,'rgba(0,0,0,.9)'); g.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=g; dctx.beginPath(); dctx.moveTo(0,-20); dctx.lineTo(len,-len*spread); dctx.lineTo(len,len*spread); dctx.lineTo(0,20); dctx.closePath(); dctx.fill();
  dctx.restore();
  const g2=dctx.createRadialGradient(tx,ty,0,tx,ty,240); g2.addColorStop(0,'rgba(0,0,0,1)'); g2.addColorStop(1,'rgba(0,0,0,0)'); dctx.fillStyle=g2; dctx.fillRect(tx-240,ty-240,480,480);
  ctx.drawImage(dark,0,0);
  // warm-cold tint in beam
  ctx.save(); ctx.globalCompositeOperation='soft-light'; const g3=ctx.createRadialGradient(tx,ty,0,tx,ty,320); g3.addColorStop(0,'rgba(200,220,255,.5)'); g3.addColorStop(1,'rgba(200,220,255,0)'); ctx.fillStyle=g3; ctx.fillRect(0,0,W,H); ctx.restore();
}
function camera(t0, t, zoomFrom, zoomTo, dur, fx=W/2, fy=H/2, shake=0, tt=0){
  const z=lerp(zoomFrom,zoomTo,ease(clamp((t-t0)/dur)));
  const sx=(noise1(tt*9)-.5)*shake, sy=(noise1(tt*9+50)-.5)*shake;
  ctx.translate(fx+sx,fy+sy); ctx.scale(z,z); ctx.translate(-fx,-fy);
}

// ---------- scenes ----------
function sceneCity(t, lt){ // 0-7
  ctx.save(); camera(0,lt,1.0,1.12,7,W/2,H*.62);
  sky('#1a0505','#7a1a0a','#e0601c');
  const sg=ctx.createRadialGradient(W*.62,H*.55,10,W*.62,H*.55,520); sg.addColorStop(0,'rgba(255,170,90,.85)'); sg.addColorStop(.2,'rgba(255,120,50,.35)'); sg.addColorStop(1,'rgba(255,90,30,0)'); ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,200,140,.9)'; ctx.beginPath(); ctx.arc(W*.62,H*.55,70,0,7); ctx.fill();
  smoke(t,240,H*.72,3,'rgba(30,10,8,A)'); smoke(t+7,820,H*.7,9,'rgba(25,8,6,A)');
  drawSkyline(sky3,H*.74,'#5a1d10',null);
  drawSkyline(sky2,H*.8,'#2c0c07','rgba(255,150,60,A)');
  fog(t,H*.78,380,'rgba(200,80,40,A)',.6);
  drawSkyline(sky1,H*.92,'#0c0302',null,1.05);
  ctx.fillStyle='#070101'; ctx.fillRect(-200,H*.92,W+400,H);
  ctx.restore();
  drawAsh(t);
  // title
  const a=prog(lt,1.0,2.4)*(1-prog(lt,5.8,6.8));
  ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center';
  ctx.font='900 220px "Inter Display"'; ctx.fillStyle='#f3e6d8'; ctx.shadowColor='rgba(255,60,20,.8)'; ctx.shadowBlur=40;
  const jit=(hash(Math.floor(t*12))<.08)?6:0; ctx.fillText('DIA 47',W/2+jit,470);
  ctx.shadowBlur=0; ctx.font='600 44px "Inter"'; ctx.fillStyle='rgba(243,230,216,.85)'; ctx.letterSpacing='8px';
  ctx.fillText('EPISÓDIO 1 · O ÚLTIMO SINAL',W/2,555); ctx.restore();
}
const cars=(()=>{const r=rng(77);const a=[];for(let i=0;i<5;i++)a.push({d:.15+i*.17+r()*.05,side:r()<.5?-1:1,off:.3+r()*.5,rot:(r()-.5)*.3});return a;})();
function sceneStreet(t, lt){ // 7-15
  ctx.save(); camera(0,lt,1.04,1.0,8,W/2,H*.5,4,t);
  sky('#200606','#6e1a0c','#c4521c');
  const vx=W/2, vy=H*.47;
  const sg=ctx.createRadialGradient(vx,vy,10,vx,vy,600); sg.addColorStop(0,'rgba(255,150,70,.7)'); sg.addColorStop(1,'rgba(255,90,30,0)'); ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  smoke(t,640,vy+40,4,'rgba(30,10,8,A)');
  drawSkyline(sky3,vy+20,'#4a170c',null,.6);
  // road
  ctx.fillStyle='#120807'; ctx.beginPath(); ctx.moveTo(vx-30,vy); ctx.lineTo(vx+30,vy); ctx.lineTo(W+500,H); ctx.lineTo(-500,H); ctx.closePath(); ctx.fill();
  // center dashes
  ctx.fillStyle='rgba(200,170,120,.25)'; for(let i=0;i<14;i++){ const k=((i/14)+lt*0.02)%1; const p=k*k; const y=lerp(vy,H,p), w=lerp(1,26,p), h=lerp(2,140,p); ctx.fillRect(vx-w/2,y,w,h); }
  // building walls left/right
  for(const side of [-1,1]){ ctx.fillStyle=side<0?'#0b0403':'#0e0504'; ctx.beginPath(); ctx.moveTo(vx+side*40,vy-40); ctx.lineTo(vx+side*40,vy+10); ctx.lineTo(vx+side*(W*0.9),H); ctx.lineTo(side<0?-50:W+50,H); ctx.lineTo(side<0?-50:W+50,-200); ctx.lineTo(vx+side*(W*0.9),-50); ctx.closePath(); ctx.fill();
    // window holes along walls
    for(let i=1;i<9;i++){ const p=Math.pow(i/9,1.6); const x=lerp(vx+side*60,vx+side*W*.85,p); const top=lerp(vy-70,-30,p), bot=lerp(vy-20,H*.55,p); const ww=lerp(4,60,p); ctx.fillStyle=(hash(i*side+3)<.25)?'rgba(255,120,40,.35)':'rgba(0,0,0,.6)'; ctx.fillRect(x-ww/2,top+ (bot-top)*.2, ww,(bot-top)*.35); }
  }
  // cars
  for(const c of cars){ const p=c.d*c.d; const y=lerp(vy,H,p)+10; const s=lerp(.05,1.5,p); const x=vx+c.side*lerp(20,W*.55,p)*c.off*1.6;
    ctx.save(); ctx.translate(x,y); ctx.rotate(c.rot); ctx.scale(s,s); ctx.fillStyle='#060202';
    rrect(-170,-90,340,80,18); ctx.fill(); ctx.beginPath(); ctx.moveTo(-100,-90); ctx.lineTo(-60,-150); ctx.lineTo(70,-150); ctx.lineTo(110,-90); ctx.fill();
    ctx.fillStyle='rgba(255,140,60,.18)'; ctx.fillRect(-50,-140,110,40); ctx.restore(); }
  fog(t,vy+120,420,'rgba(200,90,40,A)',.8);
  ctx.restore();
  // Tomás walking away
  const p=ease(prog(lt,0,8)); const s=lerp(1.15,.72,p); const y=lerp(H+120,H*.86,p);
  drawTomas(W/2+Math.sin(lt*.8)*20,y,s,lt*4.2,t);
  drawAsh(t,'rgba(220,190,170,A)',90);
}
function sceneWalkie(t, lt){ // 15-23
  ctx.save(); camera(0,lt,1.0,1.1,8,W/2,H*.5, lt>1.8&&lt<4.2?10:2, t);
  sky('#050608','#0b0d10','#050505');
  for(let i=0;i<14;i++){ const x=hash(i)*W, y=hash(i+20)*H, r=60+hash(i+40)*120; const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${i%3?255:120},${i%3?120:170},60,${.12+hash(i+9)*.1})`); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r); }
  ctx.translate(W/2,H*.4); ctx.scale(.9,.9); ctx.rotate(-.07);
  // antenna
  ctx.fillStyle='#151515'; rrect(90,-560,46,260,18); ctx.fill();
  // body
  const bg=ctx.createLinearGradient(-250,0,250,0); bg.addColorStop(0,'#a37a0c'); bg.addColorStop(.4,'#e6b822'); bg.addColorStop(1,'#8a6508'); ctx.fillStyle=bg; rrect(-240,-330,480,760,60); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=6; ctx.stroke();
  // scratches
  ctx.strokeStyle='rgba(60,40,0,.5)'; ctx.lineWidth=3; for(let i=0;i<8;i++){ ctx.beginPath(); const sx=-200+hash(i+5)*380, sy=-280+hash(i+8)*680; ctx.moveTo(sx,sy); ctx.lineTo(sx+30+hash(i)*40,sy+hash(i+2)*20-10); ctx.stroke(); }
  // speaker grille
  ctx.fillStyle='#1b1406'; for(let r=0;r<6;r++) for(let c=0;c<7;c++){ ctx.beginPath(); ctx.arc(-150+c*50,-220+r*40,10,0,7); ctx.fill(); }
  // screen
  ctx.fillStyle='#0d1a0d'; rrect(-170,60,340,170,20); ctx.fill();
  const statics = lt>1.8&&lt<4.4;
  const lostSig = lt>4.4;
  ctx.save(); ctx.beginPath(); rrect(-160,70,320,150,14); ctx.clip();
  const glow=lostSig?(Math.sin(lt*7)>0?1:.35):1;
  ctx.fillStyle=`rgba(80,255,120,${.12*glow})`; ctx.fillRect(-170,60,340,170);
  ctx.font='700 72px "JetBrains Mono"'; ctx.textAlign='center'; ctx.fillStyle=`rgba(120,255,140,${glow})`; ctx.shadowColor='rgba(80,255,120,.9)'; ctx.shadowBlur=20;
  if(lostSig){ ctx.font='700 50px "JetBrains Mono"'; ctx.fillText('SEM SINAL',0,170); } else ctx.fillText('CH 09',0,175);
  if(statics){ ctx.shadowBlur=0; for(let i=0;i<20;i++){ ctx.fillStyle=`rgba(150,255,160,${hash(i+Math.floor(t*30))*.6})`; ctx.fillRect(-160,70+hash(i*3+Math.floor(t*30))*150,320,3+hash(i)*6);} }
  ctx.restore();
  // buttons
  ctx.fillStyle='#2a2006'; rrect(-120,280,90,60,14); ctx.fill(); rrect(30,280,90,60,14); ctx.fill();
  // LED
  const led=Math.sin(t*5)>0; ctx.fillStyle=led?'#ff2a2a':'#4a0a0a'; ctx.beginPath(); ctx.arc(170,-280,16,0,7); ctx.fill();
  if(led){ const g=ctx.createRadialGradient(170,-280,0,170,-280,90); g.addColorStop(0,'rgba(255,40,40,.6)'); g.addColorStop(1,'rgba(255,40,40,0)'); ctx.fillStyle=g; ctx.fillRect(80,-370,180,180); }
  ctx.restore();
  // hand silhouette at bottom holding
  ctx.fillStyle='#0a0705'; ctx.beginPath(); ctx.ellipse(W*.32,H*.86,260,180,-.5,0,7); ctx.fill();
}
function sceneMarketExt(t, lt){ // 23-31
  ctx.save(); camera(0,lt,1.0,1.1,8,W/2,H*.55);
  sky('#02040a','#0a1328','#0a0a12');
  // stars
  for(let i=0;i<60;i++){ ctx.fillStyle=`rgba(255,255,255,${.2+.5*hash(i+Math.floor(t*2)*0.001)})`; ctx.fillRect(hash(i)*W,hash(i+99)*H*.35,2,2); }
  drawSkyline(sky2,H*.5,'#070b16',null,.8);
  // facade
  ctx.fillStyle='#121520'; ctx.fillRect(60,H*.36,W-120,H*.34);
  ctx.fillStyle='#0b0d14'; ctx.fillRect(60,H*.36,W-120,40);

    if(speech){ const s=1+.06*Math.sin(lt*30)*clamp(1-lt); ctx.translate(W/2,baseY); ctx.scale(s,s); ctx.translate(-W/2,-baseY); }
    lines.forEach((ln,li)=>{ const ws=ln.split(' '); const full=ctx.measureText(ln).width; let x=W/2-full/2; ctx.textAlign='left';
      for(const w of ws){ const vis=idx<reveal; idx++; const ww=ctx.measureText(w+' ').width;
        ctx.lineWidth=speech?14:12; ctx.strokeStyle='rgba(0,0,0,.9)'; ctx.lineJoin='round';
        if(vis){ ctx.strokeText(w,x,baseY+li*lh); ctx.fillStyle=speech?'#ff3030':'#ffffff'; if(speech){ctx.shadowColor='rgba(255,0,0,.8)'; ctx.shadowBlur=30;} ctx.fillText(w,x,baseY+li*lh); ctx.shadowBlur=0; }
        x+=ww; } });
    ctx.restore(); }
}

// ---------- timeline ----------
const SCENES=[[0,7,sceneCity],[7,15,sceneStreet],[15,23,sceneWalkie],[23,31,sceneMarketExt],[31,40,sceneInside],[40,47,sceneScare],[47,56,sceneDoor],[56,65,sceneHorde],[65,73,sceneDilemma],[73,78,sceneCountdown],[78,92,sceneChoice]];
const HARDCUTS=[40,73];
function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  for(const [a,b,fn] of SCENES){ if(t>=a&&t<b){ ctx.save(); fn(t,t-a); ctx.restore(); break; } }
  vignette(); grain(t);
  // fades
  let f=0; for(const [a] of SCENES){ if(a===0||HARDCUTS.includes(a)) continue; f=Math.max(f,1-Math.abs(t-a)/.45); }
  f=Math.max(f,1-t/.6); f=Math.max(f,clamp((t-(DURATION-.8))/.8));
  if(f>0){ ctx.fillStyle=`rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0,0,W,H); }
  captions(t);
}
window.render=render; window.DURATION=DURATION;
window.frame=(t)=>{ render(t); return cv.toDataURL('image/jpeg',.9); };
</script>
